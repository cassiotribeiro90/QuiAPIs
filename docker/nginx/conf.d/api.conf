server {
    listen 80;
    server_name localhost;
    
    # 👇 JÁ APONTANDO PARA A PASTA WEB DO YII2
    root /var/www/html/yii2api/web;
    index index.php index.html;

    # Logs separados para cada API (opcional)
    access_log /var/log/nginx/api-lojista-access.log;
    error_log /var/log/nginx/api-lojista-error.log;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Arquivos estáticos com cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Segurança
    location ~ /\.(ht|svn|git|env|yml|log) {
        deny all;
    }
}

